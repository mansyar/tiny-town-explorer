<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >
    <meta name="theme-color" content="#87ceeb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>Tiny Town Explorers</title>
    <!--
      Styling hangs off a class rather than the #app id (html-css.md: avoid ID
      selectors for styling); the id stays as the bootstrap hook for main.ts.
    -->
    <style>
      html,
      body {
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        background: #87ceeb;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        padding: 0;
        touch-action: none;
        user-select: none;
      }
      .stage {
        inset: 0;
        position: fixed;
      }
      .stage canvas {
        display: block;
        /* The renderer only sizes the drawing buffer; CSS sizing is what
           keeps the canvas matched to the viewport on every orientation. */
        height: 100%;
        width: 100%;
      }
      /*
        The controls (see game/hud/vehicleHud.ts). A fixed overlay with
        pointer-events off, so a tap anywhere else still falls through to the
        town, re-enabled on the buttons themselves. Sized in px rather than rem
        because a pre-reader's fingers do not resize with the font.
      */
      .hud {
        inset: 0;
        pointer-events: none;
        position: fixed;
      }
      .hud-vehicles {
        bottom: calc(20px + env(safe-area-inset-bottom));
        display: flex;
        gap: 18px;
        left: calc(20px + env(safe-area-inset-left));
        position: absolute;
        pointer-events: auto;
      }
      .hud-button {
        align-items: center;
        border: 4px solid #ffffff;
        border-radius: 50%;
        box-shadow: 0 6px 0 rgb(0 0 0 / 18%);
        color: #ffffff;
        display: flex;
        height: 84px;
        justify-content: center;
        padding: 0;
        transition:
          transform 120ms ease-out,
          box-shadow 120ms ease-out;
        width: 84px;
      }
      .hud-button svg {
        height: 48px;
        width: 48px;
      }
      .hud-button.is-active {
        box-shadow:
          0 6px 0 rgb(0 0 0 / 18%),
          0 0 0 6px rgb(255 255 255 / 65%);
        transform: translateY(-6px) scale(1.08);
      }
      .hud-button--fire {
        background: #e1473e;
      }
      .hud-button--iceCream {
        background: #ff8aae;
      }
      .hud-button--garbage {
        background: #57a05a;
      }
      .hud-button--police {
        background: #3f6fc4;
      }
      .hud-button--ability {
        bottom: calc(20px + env(safe-area-inset-bottom));
        height: 96px;
        pointer-events: auto;
        position: absolute;
        right: calc(104px + env(safe-area-inset-right));
        width: 96px;
      }
      .hud-button--ability.is-busy {
        opacity: 0.45;
        transform: scale(0.94);
      }
      .hud-button--mute {
        background: #5e6a78;
        bottom: calc(20px + env(safe-area-inset-bottom));
        height: 72px;
        pointer-events: auto;
        position: absolute;
        right: calc(20px + env(safe-area-inset-right));
        width: 72px;
      }
      .hud-button--mute.is-muted {
        background: #9aa4b0;
      }
    </style>
  </head>
  <body>
    <div id="app" class="stage"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
