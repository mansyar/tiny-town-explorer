<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >
    <meta name="theme-color" content="#87ceeb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>Tiny Town Explorers</title>
    <!--
      Styling hangs off a class rather than the #app id (html-css.md: avoid ID
      selectors for styling); the id stays as the bootstrap hook for main.ts.
    -->
    <style>
      html,
      body {
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        background: #87ceeb;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        padding: 0;
        touch-action: none;
        user-select: none;
      }
      .stage {
        inset: 0;
        position: fixed;
      }
      .stage canvas {
        display: block;
        /* The renderer only sizes the drawing buffer; CSS sizing is what
           keeps the canvas matched to the viewport on every orientation. */
        height: 100%;
        width: 100%;
      }
      /*
        The controls (see game/hud/vehicleHud.ts). A fixed overlay with
        pointer-events off, so a tap anywhere else still falls through to the
        town, re-enabled on the buttons themselves. Sized in px rather than rem
        because a pre-reader's fingers do not resize with the font.
      */
      .hud {
        inset: 0;
        pointer-events: none;
        position: fixed;
      }
      .hud-vehicles {
        bottom: calc(20px + env(safe-area-inset-bottom));
        display: flex;
        gap: 18px;
        left: calc(20px + env(safe-area-inset-left));
        position: absolute;
        pointer-events: auto;
      }
      .hud-button {
        align-items: center;
        border: 4px solid #fff;
        border-radius: 50%;
        box-shadow: 0 6px 0 rgb(0 0 0 / 18%);
        color: #fff;
        display: flex;
        height: 84px;
        justify-content: center;
        padding: 0;
        transition:
          transform 120ms ease-out,
          box-shadow 120ms ease-out;
        width: 84px;
      }
      .hud-button svg {
        height: 48px;
        width: 48px;
      }
      .hud-button.is-active {
        box-shadow:
          0 6px 0 rgb(0 0 0 / 18%),
          0 0 0 6px rgb(255 255 255 / 65%);
        transform: translateY(-6px) scale(1.08);
      }
      .hud-button--fire {
        background: #e1473e;
      }
      .hud-button--iceCream {
        background: #ff8aae;
      }
      .hud-button--garbage {
        background: #57a05a;
      }
      .hud-button--police {
        background: #3f6fc4;
      }
      /* FR6/AC4: the quiet town's one ask — a soft beacon on the police
         button only, never the big ability button. `scale` (not `transform`)
         so an active button's own lift survives the pulse. */
      .hud-button--police.is-pulsing {
        animation: police-pulse 1.1s ease-in-out infinite;
      }
      @keyframes police-pulse {
        0%,
        100% {
          filter: brightness(1);
          scale: 1;
        }
        50% {
          filter: brightness(1.22);
          scale: 1.09;
        }
      }
      .hud-button--ability {
        bottom: calc(20px + env(safe-area-inset-bottom));
        height: 96px;
        pointer-events: auto;
        position: absolute;
        right: calc(104px + env(safe-area-inset-right));
        width: 96px;
      }
      .hud-button--ability.is-busy {
        opacity: 0.45;
        transform: scale(0.94);
      }
      /* Out of reach, the ability button *is* the hose the car cannot use yet,
         so it is not on screen at all. An open ice-cream order never hides it:
         that jingle is how the kid answers the order, from any distance. */
      .hud-button--ability.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      /* The parent panel (see game/hud/parentPanel.ts). The gear is deliberately
         the least interesting thing on screen, and the ring that fills while it
         is held is the only feedback it needs. */
      .panel-gate {
        align-items: center;
        background: #5e6a78;
        border: 0;
        border-radius: 50%;
        bottom: calc(112px + env(safe-area-inset-bottom));
        color: #fff;
        display: flex;
        height: 56px;
        justify-content: center;
        opacity: 0.55;
        padding: 0;
        pointer-events: auto;
        position: absolute;
        right: calc(28px + env(safe-area-inset-right));
        width: 56px;
      }
      .panel-gate svg {
        height: 30px;
        width: 30px;
      }
      .panel-gate::after {
        background: conic-gradient(
          #fff calc(var(--hold, 0) * 360deg),
          rgb(255 255 255 / 22%) 0
        );
        border-radius: 50%;
        content: '';
        inset: -6px;
        opacity: 0;
        pointer-events: none;
        position: absolute;
        transition: opacity 120ms ease-out;
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 5px),
          #000 calc(100% - 4px)
        );
        mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 5px),
          #000 calc(100% - 4px)
        );
      }
      .panel-gate.is-holding::after {
        opacity: 1;
      }
      .panel {
        align-items: center;
        background: rgb(16 26 40 / 55%);
        display: none;
        inset: 0;
        justify-content: center;
        pointer-events: auto;
        position: fixed;
      }
      .panel.is-open {
        display: flex;
      }
      .panel-card {
        align-items: center;
        background: #fff;
        border-radius: 28px;
        box-shadow: 0 18px 40px rgb(0 0 0 / 25%);
        display: flex;
        gap: 22px;
        padding: 28px 30px;
        position: relative;
      }
      .panel-toggle {
        align-items: center;
        background: #57a05a;
        border: 4px solid #eef1f4;
        border-radius: 50%;
        color: #fff;
        display: flex;
        height: 76px;
        justify-content: center;
        padding: 0;
        width: 76px;
      }
      .panel-toggle svg {
        height: 40px;
        width: 40px;
      }
      .panel-toggle--helper {
        background: #3f6fc4;
      }
      /* Off is dimmed and greyed, so the state reads without a word. */
      .panel-toggle.is-off {
        background: #b9c1ca;
        color: #eef1f4;
      }
      .panel-close {
        align-items: center;
        background: #5e6a78;
        border: 0;
        border-radius: 50%;
        color: #fff;
        display: flex;
        height: 44px;
        justify-content: center;
        padding: 0;
        position: absolute;
        right: -10px;
        top: -10px;
        width: 44px;
      }
      .panel-close svg {
        height: 22px;
        width: 22px;
      }
      /* The add-to-home-screen nudge (see game/hud/installHint.ts): icons only,
         pointing up at chrome the game does not own. */
      .install-hint {
        align-items: center;
        background: rgb(16 26 40 / 72%);
        border-radius: 22px;
        bottom: calc(150px + env(safe-area-inset-bottom));
        color: #fff;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 12px 18px;
        pointer-events: auto;
        position: fixed;
        right: calc(18px + env(safe-area-inset-right));
        transition: opacity 200ms ease-out;
      }
      .install-hint svg {
        height: 30px;
        width: 30px;
      }
      .install-hint .install-hint__arrow {
        height: 24px;
        transform: translateY(calc(var(--bob, 0) * -5px));
        width: 24px;
      }
      .hud-button--mute {
        background: #5e6a78;
        bottom: calc(20px + env(safe-area-inset-bottom));
        height: 72px;
        pointer-events: auto;
        position: absolute;
        right: calc(20px + env(safe-area-inset-right));
        width: 72px;
      }
      .hud-button--mute.is-muted {
        background: #9aa4b0;
      }
      /*
        The boot overlay (see game/hud/bootOverlay.ts). It covers the page while
        the town mounts, so a touch on it is the first gesture that unlocks
        audio, and it keeps those touches from reaching the world underneath
        before there is a world to play. Icons only, like everything else a
        three-year-old ever sees.
      */
      .boot {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 22px;
        inset: 0;
        justify-content: center;
        pointer-events: auto;
        position: fixed;
      }
      .boot__toy {
        animation: boot-bounce 1.6s ease-in-out infinite;
        color: #fff;
        height: 96px;
        width: 96px;
      }
      .boot__retry {
        align-items: center;
        background: #3f6fc4;
        border: 4px solid #fff;
        border-radius: 50%;
        box-shadow: 0 6px 0 rgb(0 0 0 / 18%);
        color: #fff;
        display: flex;
        height: 96px;
        justify-content: center;
        padding: 0;
        pointer-events: auto;
        width: 96px;
      }
      .boot__retry svg {
        height: 52px;
        width: 52px;
      }
      @keyframes boot-bounce {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-10px) scale(1.04);
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="stage"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
